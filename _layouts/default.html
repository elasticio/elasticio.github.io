<!DOCTYPE html>
<html lang="en">
<head>
  {% if site.data.tenant.name == "elastic.io" %}
  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-19509666-11"></script>
  <script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'UA-19509666-11');
  </script>
  {% endif %}
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>{{site.data.tenant.name}} Documentation | {{page.title}}</title>
    <meta name="description" content="{{page.description}}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="/assets/css/common.css" rel="stylesheet">
    <link href="/assets/css/font-awesome.min.css" rel="stylesheet">
    <link href="/assets/css/modern-theme.css" rel="stylesheet">

    <script src="/assets/js/jquery.min.js"></script>
    <script src="/assets/js/client.js"></script>

    <link rel="shortcut icon" href="/assets/img/favicon.ico">

    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      })();
    </script>

</head>
<body>

<div class="page">

    <header>
        <div class="wrap">

            <div class="search">
                <i class="search__ico"></i>
                <div class="search__inner">
                    <input type="text" name="q" id="search-input" class="search__input" placeholder="Search documentation..." autocomplete="off">
                </div>

                <div id="hits"></div>
            </div>
            <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
                <i class="fa fa-moon-o"></i>
                <i class="fa fa-sun-o"></i>
            </button>
            <a href="/" class="logo"></a>
        </div>
    </header>

    {{ content }}
    <div class="footer__spacer"></div>
</div>

<footer>
    <div class="wrap">
        <div class="footer__bar">
            <div class="footer__copy">
                &copy; Copyright {{ 'now' | date: "%Y" }} {{site.data.tenant.companyName}}
                &nbsp; | &nbsp; <a href="/toc.html" title="Table of Contents">Table Of Contents</a> &nbsp; | Got a question? <a href="mailto:{{site.data.tenant.supportEmail}}?subject=Question about {{page.title}} article">Contact Support</a>
            </div>
        </div>
    </div>
</footer>

<script>
    (function () {
        var toggle = document.getElementById('theme-toggle');
        if (!toggle) return;
        toggle.addEventListener('click', function () {
            var current = document.documentElement.getAttribute('data-theme');
            var isDark = current
                ? current === 'dark'
                : window.matchMedia('(prefers-color-scheme: dark)').matches;
            var next = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });
    })();
</script>

<script src="/assets/js/local-search.js"></script>

</body>
<script type="text/javascript" src="/assets/js/site.js"></script>
<script type="text/javascript" src="/assets/js/lightbox.js"></script>
<link rel="stylesheet" href="/assets/css/lightbox.css">
</html>
